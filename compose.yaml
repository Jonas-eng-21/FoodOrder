name: foodorder

services:
  app:
    build:
      context: .
      target: dev
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    env_file: .env
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${DEV_PORT:-8080}:8000"
    volumes:
      - .:/app
      - vendor_data:/app/vendor
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  vendor_data:
  sqlite_data:
