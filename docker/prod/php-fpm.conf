; FoodOrder PHP-FPM pool. Runs as the unprivileged "app" user (no user/group directives).
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 9000
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Health probe answered by FPM itself (see the compose healthcheck).
ping.path = /fpm-ping
ping.response = pong

; Laravel reads its configuration from the container environment.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
