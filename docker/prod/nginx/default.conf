# FoodOrder production web server: serves public/ and forwards only the Laravel front controller to PHP-FPM.
server_tokens off;

server {
    listen 8080;
    server_name _;

    root /var/www/public;
    index index.php;
    autoindex off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # Local assets only; the two inline scripts of the order pages need 'unsafe-inline' for scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Hidden files (.env, .git, .htaccess...) are never served.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Internal project folders and sensitive file types are never served, even if they were present.
    location ~ ^/(app|bootstrap|config|context|database|docker|resources|routes|scripts|storage|tests|vendor/(?!bootstrap/))(/|$) {
        return 404;
    }
    location ~* \.(sqlite3?|db|env|log|lock|sh|ya?ml|ini|conf|md|json)$ {
        return 404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Only the front controller reaches PHP-FPM, and only through an internal redirect.
    location = /index.php {
        internal;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }
}
