; FoodOrder production PHP settings (loaded after the image defaults).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
memory_limit = 128M
zend.assertions = -1

opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
; The code is baked into an immutable image: no need to stat files on every request.
opcache.validate_timestamps = 0
